name: Manual Publish / Build

on:
  workflow_dispatch:
    inputs:
      run_build_check:
        description: "Run build/install smoke before publish"
        required: false
        default: "true"
      publish_to_pypi:
        description: "Actually publish to PyPI"
        required: false
        default: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_to_pypi == 'true' }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history and tags for hatch-vcs
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build package
      run: python -m build
    - name: Publish package
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*

  test:
    runs-on: ubuntu-latest
    if: ${{ inputs.run_build_check == 'true' }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Test build
      env:
        AMAP_MAPS_API_KEY: mock_key_for_testing
      run: |
        python -m pip install dist/*.whl
        python -c "import amap_mcp_server" 
